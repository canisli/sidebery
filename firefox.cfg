//
try {
  var WindowMediator = Components.classes["@mozilla.org/appshell/window-mediator;1"]
    .getService(Components.interfaces.nsIWindowMediator);

  var ObserverService = Components.classes["@mozilla.org/observer-service;1"]
    .getService(Components.interfaces.nsIObserverService);

  var Focus = Components.classes["@mozilla.org/focus-manager;1"]
    .getService(Components.interfaces.nsIFocusManager);

  var ConsoleService = Components.classes["@mozilla.org/consoleservice;1"]
    .getService(Components.interfaces.nsIConsoleService);

  var SIDEBERY_UUID = "3c078156-979c-498b-8990-85f7987dd929";
  var KEY_ID = "key_focus_sidebery_sidebar";

  function log(msg) {
    ConsoleService.logStringMessage("[Sidebery AutoConfig] " + msg);
  }

  function findSideberySidebarId(win) {
    var sc = win.SidebarController;
    var tools = sc && sc.toolsAndExtensions;
    if (!tools || !tools.keys) return "_" + SIDEBERY_UUID + "_-sidebar-action";

    var keys = tools.keys();
    var item = keys.next();

    while (!item.done) {
      var id = String(item.value);
      if (id.indexOf(SIDEBERY_UUID) !== -1 || id.toLowerCase().indexOf("sidebery") !== -1) {
        return id;
      }
      item = keys.next();
    }

    return null;
  }

  function focusSidebarPage(win) {
    try {
      var sc = win.SidebarController;
      var outer = sc && sc.browser;

      if (!outer) {
        log("no outer sidebar browser");
        return;
      }

      var outerDoc = outer.contentDocument;
      var panelBrowser = outerDoc && outerDoc.getElementById("webext-panels-browser");

      log(
        "outer url=" +
          (outer.contentWindow && outer.contentWindow.location
            ? outer.contentWindow.location.href
            : "none") +
          " panelBrowser=" +
          !!panelBrowser
      );

      if (!panelBrowser) {
        log("missing #webext-panels-browser");
        return;
      }

      var cw = panelBrowser.contentWindow;
      var cd = panelBrowser.contentDocument;

      log(
        "inner url=" +
          (cw && cw.location ? cw.location.href : "none") +
          " ready=" +
          (cd ? cd.readyState : "none") +
          " hasHook=" +
          !!(cw && cw.sideberyFocusRoot)
      );

      outer.focus();
      Focus.setFocus(outer, Focus.FLAG_NOSCROLL | Focus.FLAG_BYKEY);

      panelBrowser.focus();
      Focus.setFocus(panelBrowser, Focus.FLAG_NOSCROLL | Focus.FLAG_BYKEY);

      if (!cw) return;

      if (cw.sideberyFocusRoot) {
        cw.sideberyFocusRoot("autoconfig");
        log("called sideberyFocusRoot");
        return;
      }

      cw.dispatchEvent(new cw.CustomEvent("SidebarFocused"));
      log("dispatched SidebarFocused to inner webext panel");
    } catch (e) {
      log("focusSidebarPage failed " + e);
    }
  }

  function closeSidebery(win, sc, sidebarId) {
    try {
      log("closing " + sidebarId);

      if (sc && sc.hide) {
        sc.hide({ dismissPanel: true });
        return;
      }

      if (win.browser && win.browser.sidebarAction && win.browser.sidebarAction.close) {
        win.browser.sidebarAction.close();
      }
    } catch (e) {
      log("closeSidebery failed " + e);
    }
  }

  function focusSidebery(win) {
    try {
      var sc = win.SidebarController;
      if (!sc) {
        log("no SidebarController");
        return;
      }

      var sidebarId = findSideberySidebarId(win);
      if (!sidebarId) {
        log("Sidebery sidebar action not registered");
        return;
      }

      log("requested " + sidebarId + " current=" + sc.currentID + " open=" + sc.isOpen);

      if (sc.isOpen && sc.currentID === sidebarId) {
        closeSidebery(win, sc, sidebarId);
        return;
      }

      var result = sc.show(sidebarId);

      if (result && typeof result.then === "function") {
        result.then(
          function (shown) {
            log("show resolved shown=" + shown);
            if (shown !== false) focusSidebarPage(win);
          },
          function (err) {
            log("show failed " + err);
          }
        );
      } else {
        focusSidebarPage(win);
      }
    } catch (e) {
      log("focusSidebery failed " + e);
    }
  }

  function install(win) {
    try {
      var doc = win.document;
      if (!doc || doc.getElementById(KEY_ID)) return;

      var key = doc.createXULElement("key");
      key.id = KEY_ID;
      key.setAttribute("key", "1");
      key.setAttribute("modifiers", "alt");
      key.addEventListener("command", function (event) {
        event.preventDefault();
        event.stopPropagation();
        focusSidebery(win);
      });

      (doc.getElementById("mainKeyset") || doc.documentElement).appendChild(key);
      log("installed Alt+1 key");
    } catch (e) {
      log("install failed " + e);
    }
  }

  ObserverService.addObserver(function (subject) {
    try {
      subject.setTimeout(function () {
        install(subject);
      }, 0);
    } catch (e) {
      log("startup observer failed " + e);
    }
  }, "browser-delayed-startup-finished");

  var wins = WindowMediator.getEnumerator("navigator:browser");
  while (wins.hasMoreElements()) {
    install(wins.getNext());
  }
} catch (e) {}
