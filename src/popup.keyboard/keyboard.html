<!DOCTYPE html>
<html color-scheme="system-color">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: light dark;
      background-color: light-dark(#eee, #333);
    }

    html,
    body {
      width: 80px;
      height: 40px;
      padding: 0;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: transparent;
      min-width: 80px;
      min-height: 40px;
    }

    #key_catcher {
      position: fixed;
      inset: 0;
      color: transparent;
      background: transparent;
      outline: none;
      z-index: 1;
    }

    #keyboard_log {
      position: fixed;
      inset: 0;
      box-sizing: border-box;
      margin: 0;
      padding: 24px 4px 4px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      color: light-dark(#111, #eee);
      background: light-dark(#fff, #111);
      font: 10px/1.25 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      pointer-events: none;
      z-index: 0;
    }

    #copy_log_btn {
      position: fixed;
      right: 4px;
      top: 4px;
      z-index: 2;
      min-width: 44px;
      height: 18px;
      padding: 0 6px;
      border: 1px solid light-dark(#bbb, #555);
      border-radius: 3px;
      color: light-dark(#111, #eee);
      background: light-dark(#f7f7f7, #222);
      font: 10px/16px system-ui, sans-serif;
      cursor: pointer;
    }

    #copy_log_btn:hover,
    #copy_log_btn:focus-visible {
      background: light-dark(#fff, #333);
      outline: none;
    }

    #copy_log_btn:active {
      opacity: .7;
    }
  </style>
</head>
<body>
  <div id="key_catcher" tabindex="0"></div>
  <pre id="keyboard_log" aria-hidden="true"></pre>
  <button id="copy_log_btn" type="button" title="Copy log">Copy</button>
  <script type="module" src="./keyboard.js" defer></script>
</body>
</html>
